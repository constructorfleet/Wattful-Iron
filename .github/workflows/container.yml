name: Container

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conventional-pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate title format
        shell: bash
        run: |
          pattern='^[a-z][a-z0-9-]*(\([[:alnum:]_.\/-]+\))?(!)?: .+$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Pull request title must use Conventional Commit format, for example: feat(import): support another schematic format"
            exit 1
          fi

  application-validation:
    name: Application validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web
      - name: Set up Bun for circuit build tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Lint source
        run: npm run lint
      - name: Run server and browser tests
        run: npm test
      - name: Build application
        run: npm run build

  container-integration:
    name: Container integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Check container acceptance script syntax
        run: bash -n scripts/container-acceptance.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build validation images in parallel
        run: docker buildx bake --file docker-bake.hcl ci
      - name: Test isolated container workbench acceptance
        run: |
          docker volume create circuits-smoke-projects
          docker network create circuits-smoke-net
          runner_token=runner-token-for-smoke-tests-at-least-32-bytes
          cleanup() {
            docker rm -f circuits-smoke >/dev/null 2>&1 || true
            docker rm -f circuits-build-runner >/dev/null 2>&1 || true
            docker volume rm circuits-smoke-projects >/dev/null 2>&1 || true
            docker network rm circuits-smoke-net >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name circuits-build-runner --network circuits-smoke-net \
            --network-alias build-runner --no-healthcheck --user 0:0 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e BUILD_RUNNER_TOKEN="$runner_token" \
            -e BUILD_JOB_IMAGE=wattful-iron-build-job:ci \
            -e BUILD_SANDBOX_RUNTIME=runc \
            circuits:ci node dist/server/build-runner-main.js
          runner_ready=false
          for attempt in $(seq 1 30); do
            if docker exec circuits-build-runner node -e \
              "fetch('http://127.0.0.1:3020/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              runner_ready=true
              break
            fi
            sleep 1
          done
          if [ "$runner_ready" != true ]; then
            docker logs circuits-build-runner
            exit 1
          fi
          docker run -d --name circuits-smoke --network circuits-smoke-net -p 3000:3000 \
            -e BUILD_RUNNER_URL=http://build-runner:3020 \
            -e BUILD_RUNNER_TOKEN="$runner_token" \
            -v circuits-smoke-projects:/data/projects circuits:ci
          for attempt in $(seq 1 30); do
            health_state=$(docker inspect --format '{{.State.Health.Status}}' circuits-smoke 2>/dev/null || true)
            [ "$health_state" = healthy ] && break
            sleep 2
          done
          if [ "$health_state" != healthy ]; then
            docker logs circuits-smoke
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:3000/healthz
          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -Eq 'Circuits|circuits|<div id="root"'
          if ! BASE_URL=http://127.0.0.1:3000 bash scripts/container-acceptance.sh; then
            docker logs circuits-build-runner
            docker logs circuits-smoke
            exit 1
          fi
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: circuits:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln

  validate-image:
    name: Build container image
    if: always()
    needs: [application-validation, container-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require application and container validation to pass
        env:
          APPLICATION_RESULT: ${{ needs.application-validation.result }}
          CONTAINER_RESULT: ${{ needs.container-integration.result }}
        run: |
          if [[ "$APPLICATION_RESULT" != success || "$CONTAINER_RESULT" != success ]]; then
            echo "Application validation: $APPLICATION_RESULT"
            echo "Container integration: $CONTAINER_RESULT"
            exit 1
          fi

  publish:
    name: Build ${{ matrix.platform }} image
    if: >-
      github.event_name == 'push' &&
      github.repository == 'constructorfleet/Wattful-Iron' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/constructorfleet/wattful-iron
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Build and publish image
        uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/constructorfleet/wattful-iron,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.architecture }}
      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish multi-platform manifest
    if: >-
      github.event_name == 'push' &&
      github.repository == 'constructorfleet/Wattful-Iron' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [validate-image, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/constructorfleet/wattful-iron
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Publish manifest list
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          DIGEST_DIRECTORY: ${{ runner.temp }}/digests
        run: |
          sources=()
          for digest_file in "$DIGEST_DIRECTORY"/*; do
            digest="${digest_file##*/}"
            sources+=("ghcr.io/constructorfleet/wattful-iron@sha256:$digest")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected two platform image digests, found ${#sources[@]}"
            exit 1
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "${sources[@]}"
          done <<< "$TAGS"
