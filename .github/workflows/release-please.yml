name: Release Please

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Release PRs are authored by GITHUB_TOKEN, so pull_request workflows never
      # start for them. Report their required checks here, on every push to main
      # rather than only on creation: an updated release PR has a new head commit
      # that needs its own checks before it can be merged.
      - name: Validate release PR title and dispatch its checks
        uses: actions/github-script@v9
        with:
          script: |
            const open = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: context.payload.repository.default_branch,
              per_page: 100,
            })
            const prs = open.filter((pr) => pr.labels.some((label) => label.name === 'autorelease: pending'))
            if (!prs.length) {
              core.info('No open release pull request to report checks for.')
              return
            }
            const titlePattern = /^[a-z][a-z0-9-]*(\([A-Za-z0-9._\/-]+\))?(!)?: .+$/
            for (const pr of prs) {
              const valid = titlePattern.test(pr.title)
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: valid ? 'success' : 'failure',
                context: 'Conventional PR title',
                description: valid ? 'Release PR title follows Conventional Commit format.' : 'Release PR title must use Conventional Commit format.',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              })
              const existing = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'container.yml',
                head_sha: pr.head.sha,
                per_page: 1,
              })
              if (existing.data.total_count > 0) {
                core.info(`Container validation already ran for ${pr.head.sha}; not dispatching again.`)
                continue
              }
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'container.yml',
                ref: pr.head.ref,
              })
            }

  # The release tag points at the main commit that the container workflow already
  # validates on push: lint, tests, build, container acceptance, and the image
  # scan. Require that run to have succeeded for this exact commit before any
  # release image is published, rather than re-running the suite or publishing
  # an unvalidated image.
  verify-release-validation:
    if: needs.release-please.outputs.release_created == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require a successful container run for the released commit
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG
            const ref = await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}` })
            let sha = ref.data.object.sha
            if (ref.data.object.type === 'tag') {
              const annotated = await github.rest.git.getTag({ owner: context.repo.owner, repo: context.repo.repo, tag_sha: sha })
              sha = annotated.data.object.sha
            }
            core.info(`${tag} resolves to ${sha}`)
            const deadline = Date.now() + 55 * 60 * 1000
            while (Date.now() < deadline) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'container.yml',
                head_sha: sha,
                per_page: 100,
              })
              const finished = runs.data.workflow_runs.filter((run) => run.status === 'completed')
              if (finished.some((run) => run.conclusion === 'success')) {
                core.info(`Container validation succeeded for ${sha}.`)
                return
              }
              if (finished.length && finished.every((run) => run.conclusion !== 'success')) {
                core.setFailed(`Container validation did not succeed for ${sha}: ${finished.map((run) => `${run.conclusion} (${run.html_url})`).join(', ')}`)
                return
              }
              if (!runs.data.total_count) {
                core.info(`No container run has started for ${sha} yet; waiting.`)
              } else {
                core.info(`Container validation for ${sha} is still running; waiting.`)
              }
              await new Promise((resolve) => setTimeout(resolve, 30_000))
            }
            core.setFailed(`Timed out waiting for container validation of ${sha}.`)

  prepare-release-image:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, verify-release-validation]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
    steps:
      - name: Prepare release image tags
        id: version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          major_minor="${version%.*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"

  publish-release-image:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, verify-release-validation, prepare-release-image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out released version
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release image
        uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/constructorfleet/wattful-iron,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.architecture }}
      - name: Export release image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"
      - name: Upload release image digest
        uses: actions/upload-artifact@v4
        with:
          name: release-image-digests-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-release-manifest:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, prepare-release-image, publish-release-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download release image digests
        uses: actions/download-artifact@v4
        with:
          pattern: release-image-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish release manifest lists
        env:
          VERSION: ${{ needs.prepare-release-image.outputs.version }}
          MAJOR_MINOR: ${{ needs.prepare-release-image.outputs.major_minor }}
          DIGEST_DIRECTORY: ${{ runner.temp }}/digests
        run: |
          sources=()
          for digest_file in "$DIGEST_DIRECTORY"/*; do
            digest="${digest_file##*/}"
            sources+=("ghcr.io/constructorfleet/wattful-iron@sha256:$digest")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected two platform image digests, found ${#sources[@]}"
            exit 1
          fi
          for tag in "$VERSION" "$MAJOR_MINOR"; do
            docker buildx imagetools create \
              --tag "ghcr.io/constructorfleet/wattful-iron:$tag" \
              "${sources[@]}"
          done
