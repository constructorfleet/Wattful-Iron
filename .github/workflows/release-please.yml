name: Release Please

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Validate release PR title and dispatch its checks
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            const prs = JSON.parse(process.env.RELEASE_PRS || '[]')
            const titlePattern = /^[a-z][a-z0-9-]*(\([A-Za-z0-9._\/-]+\))?(!)?: .+$/
            for (const pr of prs) {
              const valid = titlePattern.test(pr.title)
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: valid ? 'success' : 'failure',
                context: 'Conventional PR title',
                description: valid ? 'Release PR title follows Conventional Commit format.' : 'Release PR title must use Conventional Commit format.',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              })
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'container.yml',
                ref: pr.head.ref,
              })
            }

  prepare-release-image:
    if: needs.release-please.outputs.release_created == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
    steps:
      - name: Prepare release image tags
        id: version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          major_minor="${version%.*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"

  publish-release-image:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, prepare-release-image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out released version
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release image
        uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/constructorfleet/wattful-iron,push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=wattful-runtime-ci
            type=gha,scope=wattful-build-job-ci
            type=gha,scope=release-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.architecture }}
      - name: Export release image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"
      - name: Upload release image digest
        uses: actions/upload-artifact@v4
        with:
          name: release-image-digests-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-release-manifest:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, prepare-release-image, publish-release-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download release image digests
        uses: actions/download-artifact@v4
        with:
          pattern: release-image-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish release manifest lists
        env:
          VERSION: ${{ needs.prepare-release-image.outputs.version }}
          MAJOR_MINOR: ${{ needs.prepare-release-image.outputs.major_minor }}
          DIGEST_DIRECTORY: ${{ runner.temp }}/digests
        run: |
          sources=()
          for digest_file in "$DIGEST_DIRECTORY"/*; do
            digest="${digest_file##*/}"
            sources+=("ghcr.io/constructorfleet/wattful-iron@sha256:$digest")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected two platform image digests, found ${#sources[@]}"
            exit 1
          fi
          for tag in "$VERSION" "$MAJOR_MINOR"; do
            docker buildx imagetools create \
              --tag "ghcr.io/constructorfleet/wattful-iron:$tag" \
              "${sources[@]}"
          done
